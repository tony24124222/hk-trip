<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍콩 동선 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* layout: sticky schematic map on top (left on wide screens), numbered stop list below; tram-red route on harbour-teal water */
:root{
  --bg:#fff6ee; --surface:#ffffff; --ink:#3a2f35; --muted:#8a7a80; --line:#f3dfd4;
  --water:#cdeeea; --land:#fdf0e6; --accent:#ff6f91; --accent-ink:#ffffff; --done:#c9bcc0; --alt:#24a99a;
  --display:"Jua","Gowun Dodum",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221a1e; --surface:#2d2429; --ink:#fbeff2; --muted:#b9a6ad; --line:#45373d;
    --water:#1d4a47; --land:#2d2429; --accent:#ff86a3; --accent-ink:#2a0f17; --done:#6d6064; --alt:#5fd3c4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221a1e; --surface:#2d2429; --ink:#fbeff2; --muted:#b9a6ad; --line:#45373d;
  --water:#1d4a47; --land:#2d2429; --accent:#ff86a3; --accent-ink:#2a0f17; --done:#6d6064; --alt:#5fd3c4;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:16px 0 10px}
h1{font-family:var(--display);font-weight:400;font-size:28px;color:var(--accent);letter-spacing:.01em;margin:0;text-wrap:balance}
.stay{color:var(--muted);font-size:13px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:15px}
.tab small{font-weight:400;color:var(--muted);margin-left:4px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}

.grid{display:grid;gap:14px}
.mapbox{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:6px}
.map{position:relative;height:300px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);border-radius:22px;overflow:hidden;background:var(--land)}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.zoom button.fit{font-size:11px;font-weight:600}
.maphint{position:absolute;left:8px;bottom:8px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.nomap{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:13px}

.progress{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding:2px 2px 0}
.progress b{color:var(--ink)}
.progress button{border:0;background:none;text-decoration:underline;color:var(--muted);font-size:12px;padding:4px}

h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 8px}
ol.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.leg{font-size:12px;color:var(--muted);padding:0 0 0 14px;border-left:2px dashed var(--line);margin-left:17px}
.stop{display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .12s ease-out}
.stop:active{transform:translateY(2px)}
.stop.sel{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.stop.done .name{text-decoration:line-through;color:var(--muted)}
.num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;border:0;padding:0}
.stop.alt .num{background:transparent;color:var(--alt);border:2px solid var(--alt)}
.stop.done .num{background:var(--done);color:var(--surface)}
.stop.plain .num{background:transparent;color:var(--muted);border:2px dashed var(--line)}
.name{font-family:var(--display);font-size:17px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;border:1px solid var(--line);color:var(--muted)}
.tag.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.opt{color:var(--alt);border-color:var(--alt)}
.note{font-size:13.5px;margin-top:2px}
.hours{font-size:12px;color:var(--muted);margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts a,.acts button{font-size:13px;font-weight:700;text-decoration:none;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px}
.acts .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.acts .rtb{background:var(--alt);color:#fff;border-color:var(--alt)}
.acts button[aria-pressed="true"]{background:var(--done);color:var(--surface);border-color:var(--done)}
.taxi{margin-top:8px;border:2px dashed var(--line);border-radius:14px;padding:10px;background:var(--bg)}
.taxi .lbl{font-size:11px;color:var(--muted)}
.taxi .addr{font-size:19px;font-weight:600;line-height:1.35;margin:2px 0 6px}
.grouphead{font-family:var(--display);font-size:15px;color:var(--alt);padding:4px 2px 0}

.foot{margin-top:18px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.foot a{text-decoration:underline}

@media (min-width:820px){
  .grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  .mapbox{top:12px}
  .map{height:560px}
}
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
}
#map{width:100%;height:100%;background:var(--land)}
.zoom{z-index:500}
.zoom button.fit{width:auto;min-width:44px;padding:0 8px;font-size:12px}
#gps[aria-pressed="true"]{background:#1a73e8;color:#fff;border-color:#1a73e8}
.gpsmsg{font-size:12.5px;color:var(--muted);padding:6px 2px 0}
.routemsg{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding:8px 12px;border-radius:14px;background:#1a73e8;color:#fff;font-size:13.5px;font-weight:600}
.routemsg[hidden]{display:none}
.routemsg button{flex:0 0 auto;border:1px solid rgba(255,255,255,.6);background:none;color:#fff;border-radius:6px;padding:4px 8px;font-size:12px}
.pin{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:3px solid #fff;display:grid;place-items:center;font:13px var(--display);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.alt{background:#fff;color:#24a99a;border-color:#24a99a}
.pin.done{background:var(--done)}
.pin.sel{outline:3px solid var(--ink)}
.pin.next{box-shadow:0 0 0 6px rgba(255,111,145,.35),0 1px 4px rgba(0,0,0,.4)}
.pin.multi{font-size:10px}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.4)}
.leaflet-container{font-family:var(--body)}
.rt{margin-top:8px;border:2px dashed var(--alt);border-radius:16px;padding:8px 10px;background:var(--bg);cursor:default}
.rt h4{margin:6px 0 2px;font:400 14.5px var(--display);color:var(--alt)}
.rt h4:first-child{margin-top:0}
.rt .r{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0}
.rt .ln{flex:0 0 auto;color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700}
.rt .rn{flex:0 0 auto;min-width:38px;text-align:center;background:var(--ink);color:var(--surface);border-radius:6px;padding:0 5px;font-weight:700;font-size:12px}
.rt .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .t{margin-left:auto;flex:0 0 auto;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.rt .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:6px}
.rt .ft button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🥟 홍콩 동선 지도</h1>
    <span class="stay">🏨 호텔 아이콘 · 16~19일</span>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="grid">
    <div class="mapbox">
      <div class="map" id="mapwrap">
        <div id="map"></div>
        <div class="zoom">
          <button type="button" id="gps" class="fit" aria-pressed="false">내 위치</button>
          <button type="button" id="zfit" class="fit" aria-label="전체 보기">전체</button>
          <button type="button" id="zrt" class="fit" aria-label="여기 근처 실시간">🚏</button>
        </div>
      </div>
      <div class="gpsmsg" id="gpsmsg" hidden></div>
      <div id="herert"></div>
      <div class="routemsg" id="routemsg" hidden><span id="routetxt"></span><button type="button" id="routeclr">경로 지우기</button></div>
      <div class="nomap" id="nomap" hidden></div>
      <div class="progress"><span id="prog"></span><button type="button" id="reset">이 날 체크 지우기</button></div>
    </div>
    <section>
      <h2 id="daytitle"></h2>
      <ol class="stops" id="list"></ol>
      <div class="foot">
        <span>화장실 찾기: <a href="https://toilets.hk/en/map" target="_blank" rel="noopener">toilets.hk 지도</a></span>
        <span>「🚏 실시간」 = 근처 MTR·KMB 버스 도착 시간(정부 공개 자료). 지도 위 🚏 = 내 위치(없으면 지도 가운데) 근처. 시티버스(홍콩섬 대부분)는 안 나옵니다.</span>
        <span>「지도에 경로」 = 내 위치에서 그 장소까지 도보 경로(4km 넘으면 차 경로). 버스·지하철 경로는 「구글 길찾기」.</span>
        <span>영업시간은 Google 지도 기준이며 바뀔 수 있습니다.</span>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const HOTEL = {name:'호텔 아이콘', sub:'Hotel ICON', lat:22.3007586, lng:114.1796973};
const DAYS = [
 {id:'day1', tab:'✈️ Day 1', date:'16일', title:'도착 → 체크인 → 저녁', stops:[
  {id:'apt', far:true, name:'홍콩 국제공항', sub:'Hong Kong International Airport', lat:22.3137, lng:113.9309,
   note:'출국장 세븐일레븐에서 옥토퍼스카드 구매 (adult octopus HK$200)'},
  {id:'sci', leg:'A21 버스 · Hung Hom 방향 · 79~90분', name:'Hong Kong Science Museum 정류장', sub:'하차', lat:22.301088, lng:114.176539,
   note:'여기서 내려 호텔까지 걸어서 5분'},
  {id:'icon1', leg:'도보 5분', name:HOTEL.name, sub:HOTEL.sub, lat:HOTEL.lat, lng:HOTEL.lng, note:'짐 두고 저녁 먹으러 나가기'},
  {id:'yung', kind:'alt', group:'저녁 후보 (하나 고르기)', name:"Yung's Tangerine Peel Roast Goose", sub:'완차이', lat:22.2783091, lng:114.1729673,
   note:'거위구이, 차슈, 로스트포크', hours:'07:00–22:00', link:'https://maps.app.goo.gl/HTi2dXH5ahQXSZTdA?g_st=ic'},
  {id:'kam', kind:'alt', name:"Kam's Roast Goose", sub:'완차이', lat:22.277642, lng:114.175305,
   note:'거위구이, 차슈, 로스트포크', hours:'11:30–21:30', link:'https://maps.app.goo.gl/1NCnoddVPSnNJhqq7?g_st=ic'},
  {id:'ohw', kind:'alt', name:'Oh Wahh Street Food (豪華小食)', sub:'침사추이 · 호텔 근처', lat:22.2983486, lng:114.1741485,
   note:'길거리 간식, 서서 먹는 곳', hours:'12:00–03:00 (일 17:00부터)', link:'https://maps.app.goo.gl/MvSaBnZ6WPj9GVwa6?g_st=ic'}
 ]},
 {id:'day2', tab:'🚋 Day 2', date:'17일', title:'홍콩섬 한 바퀴 → 야경 → 애문생', stops:[
  {id:'icon2', name:HOTEL.name, sub:'출발', lat:HOTEL.lat, lng:HOTEL.lng, note:'조식 조금만 먹고 출발'},
  {id:'mcot', name:'마이컵오브티', sub:'My Cup of Tea · 차찬탱 · 완차이', lat:22.2761048, lng:114.1729032,
   note:'밀크티, 번, 토마토쌀국수 등', hours:'07:00–18:30', link:'https://maps.app.goo.gl/AnbzQ4uPYMt8o1nw8?g_st=ic'},
  {id:'peak', leg:'지하철 타고 이동', name:'빅토리아 피크트램', sub:'The Peak Tram · 센트럴 탑승장', lat:22.2776827, lng:114.1591909, hours:'07:30–23:00'},
  {id:'esc', name:'미드레벨 에스컬레이터', sub:'Central–Mid-Levels Escalators', lat:22.2838464, lng:114.1549689,
   note:'오전 10시 오픈. 중간중간 내려야 함', link:'https://maps.app.goo.gl/BQs13jum1nWrQJZD6?g_st=ic'},
  {id:'soho', approx:true, name:'소호 골목', sub:'헐리우드로드 · Staunton St · Elgin St', lat:22.2823, lng:114.1530,
   note:'에스컬레이터에서 내려 골목 구경'},
  {id:'pmq', name:'PMQ 복합문화공간', sub:'Aberdeen St', lat:22.283328, lng:114.1515669,
   note:'이 근처에서 에그타르트 먹어보기', link:'https://maps.app.goo.gl/C8kTvqggpSyifreH6?g_st=ic'},
  {id:'icon2b', name:HOTEL.name, sub:'휴식', lat:HOTEL.lat, lng:HOTEL.lng, note:'호텔 가서 쉬기'},
  {id:'hkma', opt:true, name:'홍콩미술관', sub:'Hong Kong Museum of Art · 무료', lat:22.2936055, lng:114.1721324,
   note:'5~6시쯤. 못 가면 안 가도 됨. 앞에서 빅토리아 하버 야경', hours:'평일 10:00–18:00 · 토일 –21:00 · 목 휴관'},
  {id:'oms', name:'애문생 (愛文生)', sub:'Oi Man Sang · 삼수이포 · 저녁', lat:22.3266872, lng:114.1623071,
   note:'흑후추 소고기 감자볶음, 소금후추 오징어 튀김, 검은콩소스 조개볶음, 소금후추 생선튀김', hours:'16:30–23:00',
   link:'https://maps.app.goo.gl/MVPRVxn2vteizhnw6?g_st=ic', taxi:'目的地：愛文生，九龍深水埗石硤尾街1A-1C號地下'}
 ]},
 {id:'day3', tab:'🍮 Day 3', date:'18일', title:'조식 → 차찬탱 (이후 미정)', stops:[
  {id:'icon3', name:HOTEL.name, sub:'출발', lat:HOTEL.lat, lng:HOTEL.lng, note:'조식 및 밥 먹기'},
  {id:'adc', name:'오스트레일리아 데일리컴퍼니', sub:'Australia Dairy Company · 차찬탱 · 조던', lat:22.304628, lng:114.1705439,
   note:'우유푸딩, 스크램블에그', hours:'07:30–22:00 · 목 휴무', link:'https://maps.app.goo.gl/HJQ5vXXJayFiS4En7?g_st=ic'},
  {id:'tbd3', kind:'plain', name:'이후 일정 미정', note:'일정표에 아직 적힌 내용이 없습니다'}
 ]},
 {id:'macau', tab:'🎰 마카오', date:'', title:'마카오', stops:[
  {id:'north', name:'북방관 (North)', sub:'베네시안 마카오 Level 1 · Shop 1015', lat:22.1484167, lng:113.5624207,
   note:'일정표에 「북방관」으로만 적혀 있어 베네시안 지점으로 넣었습니다. 다른 지점이면 알려주세요', hours:'11:00–23:00'}
 ]}
];

let day = DAYS[0], sel = null, done = {}, me = null, watchId = null;
try{ done = JSON.parse(localStorage.getItem('hk-done')||'{}') || {}; }catch(e){ done = {}; }
const save = () => { try{ localStorage.setItem('hk-done', JSON.stringify(done)); }catch(e){} };
const routeStops = d => d.stops.filter(s => s.kind!=='alt' && s.kind!=='plain');
const mapStops = d => d.stops.filter(s => s.lat && !s.far);
const nextStop = d => routeStops(d).find(s => !done[s.id]);
const label = (d, s) => s.kind==='alt' ? String.fromCharCode(65 + d.stops.filter(x=>x.kind==='alt').indexOf(s)) : s.kind==='plain' ? '·' : String(routeStops(d).indexOf(s)+1);
const dist = (a,b,c,d) => { const R=6371000,t=Math.PI/180,x=(d-b)*t*Math.cos((a+c)/2*t),y=(c-a)*t; return Math.hypot(x,y)*R; };
const fmt = m => m>=1000 ? (m/1000).toFixed(1)+'km' : Math.round(m/10)*10+'m';

const map = L.map('map', {zoomControl:true}); map.attributionControl.setPrefix(false);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);

async function fillRt(o){
  const {lat, lng, el} = o;
  const sts = MTR.map(s => [dist(lat,lng,s[3],s[4]), s]).filter(x => x[0] < 900).sort((a,b) => a[0]-b[0]).slice(0,2);
  const mtrJobs = sts.flatMap(([d,s]) => s[2].split('/').map(ln => getJ(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${ln}&sta=${s[0]}`)
    .then(r => ({s, ln, k: r.data && r.data[ln+'-'+s[0]]})).catch(() => ({s, ln, k:null}))));
  if(!kmbStops) kmbStops = getJ('https://data.etabus.gov.hk/v1/transport/kmb/stop').then(r => r.data).catch(e => { kmbStops = null; throw e; });
  const kmbJob = kmbStops.then(all => {
    const near = all.map(x => [dist(lat,lng,+x.lat,+x.long), x]).filter(x => x[0] < 350).sort((a,b) => a[0]-b[0]);
    const seen = new Set(), pick = [];
    for(const n of near){ if(seen.has(n[1].name_tc)) continue; seen.add(n[1].name_tc); pick.push(n); if(pick.length===3) break; }
    return Promise.all(pick.map(([d,x]) => getJ('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/'+x.stop).then(r => ({d, x, e:r.data})).catch(() => ({d, x, e:[]}))));
  });
  const [mtr, kmb] = await Promise.all([Promise.all(mtrJobs), kmbJob.catch(() => null)]);
  if(![...rtOpen.values()].includes(o)) return;
  const box = h('div'); let any = false;
  for(const [d,s] of sts){
    const rows = [];
    for(const m of mtr.filter(m => m.s===s && m.k)) for(const dir of ['UP','DOWN']){
      const g = {}; for(const t of (m.k[dir]||[])) (g[t.dest] = g[t.dest] || []).push(+t.ttnt);
      for(const dest in g){ const r = h('div','r'), b = h('span','ln', LINES[m.ln] ? LINES[m.ln][0] : m.ln); b.style.background = LINES[m.ln] ? LINES[m.ln][1] : '#888';
        r.append(b, h('span','d','→ '+stName(dest)), h('span','t',etaTxt(g[dest]))); rows.push(r); } }
    if(rows.length){ any = true; box.append(h('h4',null,`🚇 ${s[1]}역 · ${fmt(d)}`), ...rows); }
  }
  if(kmb) for(const {d,x,e} of kmb){
    const g = {}; for(const t of e){ if(!t.eta) continue; const k = t.route+'|'+t.dest_tc; (g[k] = g[k] || []).push(Math.round((new Date(t.eta) - Date.now())/60000)); }
    const ks = Object.keys(g); if(!ks.length) continue; any = true;
    box.append(h('h4',null,`🚌 ${x.name_tc} · ${fmt(d)}`));
    for(const k of ks.slice(0,8)){ const [rn,dest] = k.split('|'), r = h('div','r'); r.append(h('span','rn',rn), h('span','d','→ '+dest), h('span','t',etaTxt(g[k]))); box.append(r); }
  }
  if(!any) box.append(h('div','r','근처(지하철 900m · 버스 350m)에 실시간 정보가 없어요 🥲'));
  const ft = h('div','ft'), now = new Date();
  ft.append(h('span',null,`${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} 기준 · 30초마다 새로고침`));
  const x = h('button',null,'닫기'); x.type = 'button';
  x.addEventListener('click', ev => { ev.stopPropagation(); for(const [k,v] of rtOpen) if(v===o){ rtOpen.delete(k); v.el.remove(); } });
  ft.append(x); box.append(ft); el.textContent = ''; el.append(box);
}

async function routeTo(s){
  if(!me){ pendingRoute = s; routeMsg('내 위치 찾는 중…'); if(watchId===null) toggleGps(); return; }
  const far = dist(me.lat,me.lng,s.lat,s.lng);
  if(far > 100000){ routeLayer.clearLayers(); routeMsg('지금 홍콩에서 '+fmt(far)+' 떨어져 있어요. 홍콩에 도착하면 경로가 나와요 ✈️'); return; }
  const car = far > 4000, prof = car ? 'car' : 'foot';
  routeMsg('경로 찾는 중…');
  try{
    const r = await (await fetch(`https://routing.openstreetmap.de/routed-${prof}/route/v1/${car?'driving':'foot'}/${me.lng},${me.lat};${s.lng},${s.lat}?overview=full&geometries=geojson`)).json();
    const rt = r.routes && r.routes[0]; if(!rt) throw new Error(r.code);
    routeLayer.clearLayers();
    const line = L.polyline(rt.geometry.coordinates.map(c => [c[1],c[0]]), {color:'#1a73e8', weight:6, opacity:.9}).addTo(routeLayer);
    map.fitBounds(line.getBounds(), {padding:[30,30], maxZoom:17});
    routeMsg(`${s.name}까지 ${car?'차로':'걸어서'} ${fmt(rt.distance)} · 약 ${Math.max(1,Math.round(rt.duration/60))}분`);
  }catch(e){ routeMsg('경로를 못 찾았습니다. 「구글 길찾기」를 눌러 주세요.'); }
}

  for(const s of day.stops.filter(x=>x.lat)){ const alt = s.kind==='alt';
    const grp = alt ? [s] : day.stops.filter(o => o.lat===s.lat && o.lng===s.lng && o.kind!=='alt'); if(grp[0]!==s) continue;
    const cls = 'pin' + (alt?' alt':'') + (grp.every(o=>done[o.id])&&!alt?' done':'') + (grp.includes(sel)?' sel':'') + (grp.includes(nx)?' next':'') + (grp.length>1?' multi':'');

const tabs = document.getElementById('tabs');

  if(d.date) b.append(h('small',null,d.date)); b.addEventListener('click', () => setDay(d.id, true)); tabs.append(b); }

document.getElementById('gps').addEventListener('click', toggleGps);
document.getElementById('routeclr').addEventListener('click', clearRoute);
document.getElementById('zrt').addEventListener('click', () => { const c = me || map.getCenter(); openRt('_here', c.lat, c.lng, document.getElementById('herert')); });
document.getElementById('zfit').addEventListener('click', () => { sel = null; fit(); render(); });
document.getElementById('reset').addEventListener('click', () => { for(const s of day.stops) delete done[s.id]; save(); render(); });
window.addEventListener('resize', () => map.invalidateSize());
window.addEventListener('hashchange', () => setDay(location.hash.slice(1), false));
setDay(location.hash.slice(1) || 'day1', false);
</script>
</body>
